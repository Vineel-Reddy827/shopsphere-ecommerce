<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopSphere — Discover, filter, and shop thousands of products with ease." />
    <title>ShopSphere</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Skip to main content for keyboard users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Live region for announcements -->
    <div
      id="aria-live-region"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only"
    ></div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="assertive" aria-atomic="false" role="status"></div>

    <!-- Header -->
    <header id="app-header" role="banner"></header>

    <!-- Main application -->
    <main id="main-content">
      <!-- Catalog toolbar: search + filters + sort -->
      <div id="catalog-toolbar" class="catalog-toolbar"></div>

      <!-- Catalog layout -->
      <div class="catalog-layout">
        <!-- Sidebar filters -->
        <aside id="filter-sidebar" class="filter-sidebar" aria-label="Product filters"></aside>

        <!-- Product grid + pagination -->
        <section id="catalog-main" class="catalog-main" aria-label="Product catalog">
          <div id="product-grid-container"></div>
          <div id="pagination-container"></div>
        </section>
      </div>
    </main>

    <!-- Cart drawer -->
    <div id="cart-drawer-container"></div>

    <!-- Product details modal -->
    <div id="product-details-container"></div>

    <!-- Product management modal -->
    <div id="product-management-container"></div>

    <!-- Overlay -->
    <div id="overlay" class="overlay" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
