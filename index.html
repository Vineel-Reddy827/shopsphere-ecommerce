<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Task-6 standalone ecommerce product catalog — Vite + Vanilla JS + JSON Server" />
  <title>Task-6 · Product Catalog</title>
  <link rel="icon" type="image/svg+xml" href="images/product-placeholder.svg" />
</head>
<body>
  <a class="skip-link" href="#catalog">Skip to products</a>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <div>
          <p class="brand-title">Northwind Catalog</p>
          <p class="brand-sub">Task-6 · Standalone Project</p>
        </div>
      </div>

      <div class="search-wrap">
        <label class="visually-hidden" for="search">Search products</label>
        <input id="search" type="search" placeholder="Search products by title or description…" autocomplete="off" />
        <button id="search-clear" class="btn btn-ghost btn-sm" type="button" hidden>Clear</button>
      </div>

      <div class="header-actions">
        <button id="add-product-btn" class="btn btn-secondary" type="button">+ Add Product</button>
        <button id="cart-btn" class="btn btn-primary cart-btn" type="button" aria-haspopup="dialog" aria-controls="cart-drawer">
          Cart <span id="cart-count" class="cart-badge" aria-label="0 items in cart">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Catalog controls">
      <div class="toolbar-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="all">All categories</option>
        </select>
      </div>
      <div class="toolbar-group">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="default">Default</option>
          <option value="price-asc">Price: low → high</option>
          <option value="price-desc">Price: high → low</option>
          <option value="name-asc">Name: A → Z</option>
          <option value="name-desc">Name: Z → A</option>
        </select>
      </div>
      <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
    </section>

    <section id="catalog" aria-label="Product catalog">
      <div id="status" class="status" aria-live="polite"></div>
      <div id="grid" class="grid"></div>
      <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Task-6 Product Catalog · Vanilla JS (ES Modules) + Vite frontend · JSON Server backend · Cart persisted in LocalStorage</p>
    </div>
  </footer>

  <!-- Cart drawer -->
  <div id="cart-overlay" class="overlay" hidden></div>
  <aside id="cart-drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" hidden>
    <div class="drawer-head">
      <h2 id="cart-title">Shopping Cart</h2>
      <button id="cart-close" class="btn btn-ghost btn-sm" type="button" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="drawer-body"></div>
  </aside>

  <!-- Add product modal -->
  <div id="product-modal-overlay" class="overlay" hidden></div>
  <div id="product-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="product-modal-title" hidden>
    <form id="product-form" novalidate>
      <div class="modal-head">
        <h2 id="product-modal-title">Add Product</h2>
        <button id="product-modal-close" class="btn btn-ghost btn-sm" type="button" aria-label="Close form">✕</button>
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="f-title">Title *</label>
          <input id="f-title" name="title" type="text" required minlength="3" maxlength="120" placeholder="e.g. Aurora Wireless Headphones" />
          <p class="field-error" data-error-for="f-title"></p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-price">Price (USD) *</label>
            <input id="f-price" name="price" type="number" min="0.01" step="0.01" required placeholder="49.99" />
            <p class="field-error" data-error-for="f-price"></p>
          </div>
          <div class="field">
            <label for="f-category">Category *</label>
            <input id="f-category" name="category" type="text" required list="category-list" maxlength="40" placeholder="electronics" />
            <datalist id="category-list"></datalist>
            <p class="field-error" data-error-for="f-category"></p>
          </div>
        </div>
        <div class="field">
          <label for="f-image">Image URL *</label>
          <input id="f-image" name="image" type="url" required placeholder="https://picsum.photos/seed/my-product/600/600" />
          <p class="field-error" data-error-for="f-image"></p>
          <div class="img-preview-row">
            <img id="f-image-preview" alt="New product image preview" width="72" height="72" hidden />
            <span class="muted small">Use a real image URL so the card always renders a picture.</span>
          </div>
        </div>
        <div class="field">
          <label for="f-description">Description</label>
          <textarea id="f-description" name="description" rows="3" maxlength="600" placeholder="Short, helpful product description…"></textarea>
          <p class="field-error" data-error-for="f-description"></p>
        </div>
      </div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="modal-foot">
        <button type="button" id="product-cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" id="product-submit" class="btn btn-primary">Add Product</button>
      </div>
    </form>
  </div>

  <!-- Delete confirm modal -->
  <div id="confirm-overlay" class="overlay" hidden></div>
  <div id="confirm-modal" class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc" hidden>
    <h2 id="confirm-title">Delete product?</h2>
    <p id="confirm-desc" class="muted"></p>
    <div class="modal-foot">
      <button id="confirm-cancel" class="btn btn-ghost" type="button">Cancel</button>
      <button id="confirm-ok" class="btn btn-danger" type="button">Delete</button>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
